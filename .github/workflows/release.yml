name: Release artifacts

# On a published release (tag vX.Y.Z), build and attach the latex-tools
# runtime bundle that `fdoc` downloads for that pinned version. The
# FontAwesome Pro kit is released separately.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  runtime-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags, so fdoc's hatch-vcs version resolves

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fdoc
        run: python -m pip install ./cli

      - name: Determine version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build runtime bundle
        run: fdoc tools bundle --version "${{ steps.ver.outputs.version }}" -o dist

      - name: Attach bundle to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/latex-tools-runtime-v*.zip
