[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "fdoc"
dynamic = ["version"]
description = "CLI tool for managing Fiddlie documentation repositories"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Ed Hill" }
]
keywords = ["latex", "documentation", "cli", "fiddlie"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Documentation",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = [
    "click>=8.0",
    "jinja2>=3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
fdoc = "fdoc.main:cli"

[project.urls]
Homepage = "https://github.com/fiddlie/latex-tools"
Repository = "https://github.com/fiddlie/latex-tools"

# Version is derived from git tags (e.g. v2.1.0) via hatch-vcs. The git root
# is the parent of this cli/ directory. fallback_version keeps non-git builds
# (e.g. a source tree with no .git and no tags) from failing outright.
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.version.raw-options]
root = ".."

[tool.hatch.build.hooks.vcs]
version-file = "src/fdoc/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fdoc"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
]
