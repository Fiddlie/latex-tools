[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fdoc"
version = "0.1.0"
description = "CLI tool for managing Fiddlie documentation repositories"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Ed Hill" }
]
keywords = ["latex", "documentation", "cli", "fiddlie"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Documentation",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = [
    "click>=8.0",
    "jinja2>=3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
fdoc = "fdoc.main:cli"

[project.urls]
Homepage = "https://github.com/fiddlie/latex-tools"
Repository = "https://github.com/fiddlie/latex-tools"

[tool.hatch.build.targets.wheel]
packages = ["src/fdoc"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
]
