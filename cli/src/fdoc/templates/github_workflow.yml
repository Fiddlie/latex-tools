name: Build Documents

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      documents: ${{ steps.list-docs.outputs.documents }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Checkout submodules
        env:
          TOKEN: ${{ secrets.LATEX_TOOLS_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "git@github.com:"
          git submodule sync --recursive
          git submodule update --init --force --depth=1 --recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: latex-tools/cli/pyproject.toml

      - name: Install fdoc
        run: pip install -e latex-tools/cli

      - name: List documents
        id: list-docs
        run: |
          # Output JSON array for matrix
          DOCS=$(fdoc list | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "documents=$DOCS" >> $GITHUB_OUTPUT
          echo "Found documents: $DOCS"

  build:
    needs: list
    runs-on: ubuntu-latest
    strategy:
      matrix:
        document: ${{ fromJson(needs.list.outputs.documents) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Checkout submodules
        env:
          TOKEN: ${{ secrets.LATEX_TOOLS_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "git@github.com:"
          git submodule sync --recursive
          git submodule update --init --force --depth=1 --recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: latex-tools/cli/pyproject.toml

      - name: Install fdoc
        run: pip install -e latex-tools/cli

      - name: Setup TeX Live
        uses: TeX-Live/setup-texlive-action@v4
        with:
          packages: |
            scheme-basic
            latexmk
            luatex
            luatexbase
            luacode
            iftex
            fontspec
            microtype
            geometry
            fancyhdr
            lastpage
            titlesec
            enumitem
            booktabs
            longtable
            multirow
            multicol
            array
            tabularx
            threeparttable
            colortbl
            xcolor
            graphicx
            float
            caption
            hyperref
            etoolbox
            xparse
            l3keys2e
            pgf
            listings
            amsmath
            amssymb
            amsfonts
            siunitx
            draftwatermark
            luacolor
            babel
            lm
            lm-math
            tex-gyre
            arial
            arfonts
            uarial
            chemformula
            xfrac
            mhchem
            biber
            biblatex
            truncate
            xltabular
            ltablex
          cache: true

      - name: Install Arial font
        run: |
          sudo apt-get update
          sudo apt-get install -y cabextract fontconfig
          mkdir -p ~/.fonts
          cd /tmp
          wget -q https://downloads.sourceforge.net/corefonts/arial32.exe
          cabextract -q arial32.exeC
          mv *.TTF ~/.fonts/ 2>/dev/null || mv *.ttf ~/.fonts/ 2>/dev/null || true
          fc-cache -f ~/.fonts

      # Cache + install FontAwesome Pro icon fonts. Cache key includes a
      # hash of fonts.py so a kit-version bump invalidates the cache; in
      # steady state each run is an instant cache hit.
      - name: Cache FontAwesome fonts
        uses: actions/cache@v4
        with:
          path: ~/texmf/fonts/opentype/fiddlie
          key: fa-kit-${{ hashFiles('latex-tools/cli/src/fdoc/fonts.py') }}

      - name: Install FontAwesome fonts (no-op on cache hit)
        run: fdoc fonts ensure

      - name: Configure latexmk
        run: |
          echo 'do { my $rc = "../.latexmkrc"; require $rc if -f $rc; };' > ~/.latexmkrc

      - name: Set build ID
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          echo "$COMMIT_HASH" > "${{ matrix.document }}/.buildid"
          echo "Build ID set to: $COMMIT_HASH"

      - name: Build document
        run: fdoc build "${{ matrix.document }}"

      - name: Rename PDF
        id: rename-pdf
        run: |
          SAFE_NAME=$(fdoc name "${{ matrix.document }}" --safe)
          mv "${{ matrix.document }}/${{ matrix.document }}.pdf" "${{ matrix.document }}/${SAFE_NAME}.pdf"
          echo "safe-name=${SAFE_NAME}" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.rename-pdf.outputs.safe-name }}
          path: ${{ matrix.document }}/*.pdf
          if-no-files-found: error
