name: Build Documents

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      documents: ${{ steps.list-docs.outputs.documents }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout submodules
        env:
          TOKEN: ${{ secrets.LATEX_TOOLS_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "git@github.com:"
          git submodule sync --recursive
          git submodule update --init --force --depth=1 --recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: latex-tools/cli/pyproject.toml

      - name: Install fdoc
        run: pip install -e latex-tools/cli

      - name: List documents
        id: list-docs
        run: |
          # Output JSON array for matrix
          DOCS=$(fdoc list | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "documents=$DOCS" >> $GITHUB_OUTPUT
          echo "Found documents: $DOCS"

  build:
    needs: list
    runs-on: ubuntu-latest
    strategy:
      matrix:
        document: ${{ fromJson(needs.list.outputs.documents) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout submodules
        env:
          TOKEN: ${{ secrets.LATEX_TOOLS_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "git@github.com:"
          git submodule sync --recursive
          git submodule update --init --force --depth=1 --recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: latex-tools/cli/pyproject.toml

      - name: Install fdoc
        run: pip install -e latex-tools/cli

      - name: Setup TeX Live
        uses: TeX-Live/setup-texlive-action@v3
        with:
          packages: |
            scheme-basic
            latexmk
            luatex
            luatexbase
            luacode
            iftex
            fontspec
            microtype
            geometry
            fancyhdr
            lastpage
            titlesec
            enumitem
            booktabs
            longtable
            multirow
            multicol
            array
            tabularx
            threeparttable
            colortbl
            xcolor
            graphicx
            float
            caption
            hyperref
            etoolbox
            xparse
            l3keys2e
            pgf
            listings
            amsmath
            amssymb
            amsfonts
            siunitx
            draftwatermark
            luacolor
            babel
            lm
            lm-math
            tex-gyre
            arial
            arfonts
            uarial
          cache: true

      - name: Install Arial font
        run: |
          sudo apt-get update
          sudo apt-get install -y cabextract fontconfig
          mkdir -p ~/.fonts
          cd /tmp
          wget -q https://downloads.sourceforge.net/corefonts/arial32.exe
          cabextract -q arial32.exe
          mv *.TTF ~/.fonts/ 2>/dev/null || mv *.ttf ~/.fonts/ 2>/dev/null || true
          fc-cache -f ~/.fonts

      - name: Configure latexmk
        run: |
          echo 'do { my $rc = "../.latexmkrc"; require $rc if -f $rc; };' > ~/.latexmkrc

      - name: Build document
        run: fdoc build "${{ matrix.document }}"

      - name: Rename PDF
        run: |
          SAFE_NAME=$(fdoc name "${{ matrix.document }}" --safe)
          mv "${{ matrix.document }}/${{ matrix.document }}.pdf" "${{ matrix.document }}/${SAFE_NAME}.pdf"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.document }}
          path: ${{ matrix.document }}/*.pdf
          if-no-files-found: error
