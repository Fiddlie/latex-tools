name: Build Documents

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      documents: ${{ steps.list-docs.outputs.documents }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install fdoc
        env:
          TOKEN: ${{ secrets.LATEX_TOOLS_TOKEN }}
        run: pip install "git+https://x-access-token:${TOKEN}@github.com/fiddlie/latex-tools.git#subdirectory=cli"

      - name: List documents
        id: list-docs
        run: |
          # Output JSON array for matrix
          DOCS=$(fdoc list | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "documents=$DOCS" >> $GITHUB_OUTPUT
          echo "Found documents: $DOCS"

  build:
    needs: list
    runs-on: ubuntu-latest
    strategy:
      matrix:
        document: ${{ fromJson(needs.list.outputs.documents) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install fdoc
        env:
          TOKEN: ${{ secrets.LATEX_TOOLS_TOKEN }}
        run: pip install "git+https://x-access-token:${TOKEN}@github.com/fiddlie/latex-tools.git#subdirectory=cli"

      - name: Setup TeX Live
        uses: TeX-Live/setup-texlive-action@v4
        with:
          packages: |
            scheme-basic
            latexmk
            luatex
            luatexbase
            luacode
            iftex
            fontspec
            microtype
            geometry
            fancyhdr
            lastpage
            titlesec
            eso-pic
            montserrat
            refcount
            enumitem
            booktabs
            longtable
            multirow
            multicol
            array
            tabularx
            threeparttable
            colortbl
            xcolor
            graphicx
            float
            caption
            hyperref
            etoolbox
            xparse
            l3keys2e
            pgf
            listings
            amsmath
            amssymb
            amsfonts
            siunitx
            draftwatermark
            luacolor
            babel
            lm
            lm-math
            tex-gyre
            arial
            arfonts
            uarial
            chemformula
            xfrac
            mhchem
            biber
            biblatex
            truncate
            xltabular
            ltablex
          cache: true

      - name: Install Arial font
        run: |
          sudo apt-get update
          sudo apt-get install -y cabextract fontconfig
          mkdir -p ~/.fonts
          cd /tmp
          wget -q https://downloads.sourceforge.net/corefonts/arial32.exe
          cabextract -q arial32.exe
          mv *.TTF ~/.fonts/ 2>/dev/null || mv *.ttf ~/.fonts/ 2>/dev/null || true
          fc-cache -f ~/.fonts

      # Cache + install FontAwesome Pro icon fonts. fdoc owns the kit version,
      # so the cache key tracks the installed fdoc version.
      - name: Resolve fdoc version
        id: fdoc-ver
        run: echo "version=$(fdoc --version | awk '{print $NF}')" >> "$GITHUB_OUTPUT"

      - name: Cache FontAwesome fonts
        uses: actions/cache@v4
        with:
          path: ~/texmf/fonts/opentype/fiddlie
          key: fa-kit-${{ steps.fdoc-ver.outputs.version }}

      - name: Install FontAwesome fonts (no-op on cache hit)
        run: fdoc fonts ensure

      # Cache + install the pinned latex-tools runtime (keyed on the pin).
      - name: Cache latex-tools runtime
        uses: actions/cache@v4
        with:
          path: ~/.cache/fdoc/latex-tools
          key: latex-tools-runtime-${{ hashFiles('.fdocrc') }}

      - name: Install pinned latex-tools runtime (no-op on cache hit)
        run: fdoc tools ensure

      - name: Configure latexmk
        run: |
          echo 'do { my $rc = "../.latexmkrc"; require $rc if -f $rc; };' > ~/.latexmkrc

      - name: Set build ID
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          echo "$COMMIT_HASH" > "${{ matrix.document }}/.buildid"
          echo "Build ID set to: $COMMIT_HASH"

      - name: Build document
        run: fdoc build "${{ matrix.document }}"

      - name: Rename PDF
        id: rename-pdf
        run: |
          SAFE_NAME=$(fdoc name "${{ matrix.document }}" --safe)
          mv "${{ matrix.document }}/${{ matrix.document }}.pdf" "${{ matrix.document }}/${SAFE_NAME}.pdf"
          echo "safe-name=${SAFE_NAME}" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.rename-pdf.outputs.safe-name }}
          path: ${{ matrix.document }}/*.pdf
          if-no-files-found: error
